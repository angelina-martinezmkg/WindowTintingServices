<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Window Tinting Services</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(circle at 70% 20%,rgba(63,224,255,.12),transparent 50%),#070809;color:#eceff2;font-family:Inter,system-ui,sans-serif;text-align:center}
    main{max-width:620px;display:grid;justify-items:center;gap:1.2rem}
    .ico{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#2a3038,#0d0f12);box-shadow:inset 0 0 0 1px rgba(63,224,255,.4);display:grid;place-items:center}
    .ico svg{width:40px;height:40px}
    h1{margin:0;font-family:Syne,sans-serif;font-weight:800;font-size:clamp(2.4rem,8vw,4rem);line-height:.95;letter-spacing:-.04em;text-transform:uppercase}
    h1 span{color:#3fe0ff}
    p{margin:0;color:#8f97a1;font-size:1.05rem;line-height:1.7}
    .row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
    a.btn{display:inline-flex;align-items:center;min-height:3.3rem;padding:0 1.6rem;border-radius:999px;background:#3fe0ff;color:#070809;font-weight:700;text-decoration:none}
    a.btn--line{background:transparent;color:#eceff2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
    a:focus-visible{outline:2px solid #3fe0ff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <span class="ico" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M4 26L16 6l12 20z" fill="none" stroke="#3fe0ff" stroke-width="2.4" stroke-linejoin="round"/><path d="M10 26L16 16l6 10z" fill="#3fe0ff"/></svg></span>
    <h1>Nothing to <span>see here.</span></h1>
    <p>This page is a little too dark, even for us. Let's get you back home.</p>
    <div class="row">
      <a class="btn" href="/">Back to home</a>
      <a class="btn btn--line" href="tel:+10000000000">Call (000) 000-0000</a>
    </div>
  </main>
</body>
</html>
